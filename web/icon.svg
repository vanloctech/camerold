    <radialGradient id="glass" cx="52" cy="51.5" r="8.5" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#3D7BFF"/><stop offset=".6" stop-color="#1A3C9E"/><stop offset="1" stop-color="#0E2361"/></radialGradient>
  </defs>
  <rect width="108" height="108" rx="30" fill="url(#bg)"/>
  <g transform="translate(54 54) scale(1.05) translate(-54 -54)">
    <rect x="36" y="27" width="36" height="54" rx="9" fill="none" stroke="#fff" stroke-width="5"/>
    <circle cx="54" cy="54" r="11" fill="#fff"/>
    <circle cx="54" cy="54" r="6.5" fill="url(#glass)"/>
