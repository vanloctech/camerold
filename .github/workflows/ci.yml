name: CI
on:
  push:
    branches: [main]
  pull_request:

# Read-only token: CI only builds and tests (also for pull requests from forks)
permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with: { distribution: temurin, java-version: 17 }
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4
      - name: Build and unit test
        run: ./gradlew assembleGithubDebug assemblePlayDebug testGithubDebugUnitTest
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with: { name: camerold-debug-apk, path: app/build/outputs/apk/github/debug/app-github-debug.apk }

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with: { node-version: 22 }
      - name: Syntax check
        run: for f in web/js/*.js; do node --check "$f"; done
      - name: Crypto tests
        run: node --test tests/*.test.mjs
